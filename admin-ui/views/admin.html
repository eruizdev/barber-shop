<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel | Sebas Barber</title>
  <link rel="icon" href="/img/logo-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Oswald:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body>
  <div class="stripe"></div>

  <!-- Acceso -->
  <main class="login" id="login" hidden>
    <form class="login-box" id="loginForm" autocomplete="on">
      <img src="/img/logo-192.png" alt="" width="84" height="84">
      <h1>Panel interno</h1>
      <p class="muted">Sebas Barber</p>
      <div class="field">
        <label for="user">Usuario</label>
        <input id="user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="pass">Contraseña</label>
        <input id="pass" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="error" id="loginError" role="alert"></p>
      <button class="btn" type="submit">Entrar</button>
    </form>
  </main>

  <!-- App -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="wrap">
        <div class="who"><b>Sebas Barber</b><span id="whoami"></span></div>
        <button class="btn btn-sm btn-outline" id="logout" type="button">Salir</button>
      </div>
    </header>
    <nav class="tabs wrap" aria-label="Secciones">
      <button type="button" class="tab is-active" data-tab="citas">Citas</button>
      <button type="button" class="tab" data-tab="bloqueos">Bloqueos</button>
      <button type="button" class="tab" data-tab="actividad">Actividad</button>
    </nav>

    <main class="wrap">
      <!-- Citas -->
      <section id="tab-citas">
        <div class="toolbar">
          <div class="presets" id="presets">
            <button type="button" class="chip-btn" data-preset="hoy">Hoy</button>
            <button type="button" class="chip-btn" data-preset="manana">Mañana</button>
            <button type="button" class="chip-btn" data-preset="7">7 días</button>
            <button type="button" class="chip-btn" data-preset="14">14 días</button>
            <button type="button" class="chip-btn" data-preset="futuro">Todo lo próximo</button>
            <button type="button" class="chip-btn" data-preset="historial">Historial</button>
          </div>
          <div class="filters">
            <div class="field"><label for="fFrom">Desde</label><input type="date" id="fFrom"></div>
            <div class="field"><label for="fTo">Hasta</label><input type="date" id="fTo"></div>
            <div class="field">
              <label for="fStatus">Estado</label>
              <select id="fStatus">
                <option value="active">Confirmadas</option>
                <option value="all">Todas</option>
                <option value="completed">Completadas</option>
                <option value="no_show">No asistió</option>
                <option value="cancelled">Canceladas</option>
              </select>
            </div>
            <div class="field grow"><label for="fQ">Buscar</label><input type="search" id="fQ" placeholder="Nombre, celular, código"></div>
            <button type="button" class="btn" id="newAppt">+ Nueva cita</button>
          </div>
        </div>
        <p class="count" id="count"></p>
        <div id="list"></div>
      </section>

      <!-- Bloqueos -->
      <section id="tab-bloqueos" hidden>
        <p class="muted intro">Bloquea un día completo o una hora (vacaciones, trámites, almuerzo). Esas horas dejan de aparecer para los clientes.</p>
        <form class="block-form" id="blockForm">
          <div class="field"><label for="bDate">Fecha</label><input type="date" id="bDate" required></div>
          <div class="field"><label for="bTime">Hora</label><select id="bTime"></select></div>
          <div class="field grow"><label for="bReason">Motivo (opcional)</label><input id="bReason" maxlength="80"></div>
          <button class="btn" type="submit">Bloquear</button>
        </form>
        <div id="blocks"></div>
      </section>

      <!-- Actividad -->
      <section id="tab-actividad" hidden>
        <p class="muted intro">Últimos 100 movimientos del panel.</p>
        <div id="audit"></div>
      </section>
    </main>
  </div>

  <!-- Modal crear / editar -->
  <dialog id="modal">
    <form id="apptForm" method="dialog" novalidate>
      <h2 id="modalTitle">Cita</h2>
      <div class="form-grid">
        <div class="field"><label for="mName">Nombre</label><input id="mName" maxlength="60" required></div>
        <div class="field"><label for="mPhone">Celular</label><input id="mPhone" type="tel" inputmode="numeric" maxlength="20" required></div>
        <div class="field"><label for="mDate">Fecha</label><input id="mDate" type="date" required></div>
        <div class="field"><label for="mTime">Hora</label><input id="mTime" type="time" step="900" required></div>
        <div class="field full">
          <label>Horas del horario normal</label>
          <div class="chips" id="mChips"></div>
          <p class="hint" id="mHint"></p>
        </div>
        <div class="field full"><label for="mNote">Nota</label><input id="mNote" maxlength="200"></div>
      </div>
      <p class="error" id="mError" role="alert"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="mCancel">Cerrar</button>
        <button type="submit" class="btn" id="mSave">Guardar</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="/js/common.js"></script>
  <script src="/admin/assets/admin.js"></script>
</body>
</html>
