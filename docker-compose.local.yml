# Solo para probar en tu PC: sin dominio ni HTTPS. Web en http://localhost:8080
# Uso: docker compose --env-file .env.local -f docker-compose.yml -f docker-compose.local.yml up -d --build
services:
  app:
    env_file: !override
      - .env.local
    environment:
      COOKIE_SECURE: "true"      # el túnel entrega HTTPS
      TRUST_PROXY: "true"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}   # los links de WhatsApp usan esto
    ports:
      - "8080:3000"
  caddy:
    profiles: ["disabled"]   # no se usa en local
